name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cv_tailor
          POSTGRES_PASSWORD: cv_tailor_ci
          POSTGRES_DB: cv_tailor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_tailor -d cv_tailor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://cv_tailor:cv_tailor_ci@localhost:5432/cv_tailor_test
      JWT_SECRET: ci-only-secret-value-not-used-anywhere
      # Tests inject their own LLM fakes; forcing the mock provider here would
      # override the provider under test. The embedding model stays mocked so CI
      # never downloads a multi-gigabyte encoder.
      EMBEDDING_MODEL: mock
      RENDER_OUTPUT_DIR: /tmp/cv-tailor/generated_cvs
      LOG_FORMAT: text

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run backend tests
        run: uv run pytest -q -p no:cacheprovider

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cv_tailor
          POSTGRES_PASSWORD: cv_tailor_ci
          POSTGRES_DB: cv_tailor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_tailor -d cv_tailor_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://cv_tailor:cv_tailor_ci@localhost:5432/cv_tailor_e2e
      JWT_SECRET: ci-only-secret-value-not-used-anywhere
      # The suite never calls a provider, so no API key is needed anywhere here.
      EMBEDDING_MODEL: mock
      RENDER_OUTPUT_DIR: /tmp/cv-tailor/generated_cvs
      LOG_FORMAT: text
      CORS_ALLOW_ORIGINS: http://127.0.0.1:4173,http://localhost:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Apply database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Start the API
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
