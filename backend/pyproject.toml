[project]
name = "cv-tailor-backend"
version = "0.1.0"
description = "CV-Tailor FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "bcrypt>=5,<6",
    "fastembed>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=0.2,<1",
    "passlib[bcrypt]>=1.7.4,<2",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "python-jose[cryptography]>=3.5,<4",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
